<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
    let ws = new WebSocket('ws://localhost:8000/ws/echo');
    ws.onmessage = (message) => {
        alert(message.data);
    };
    ws.onopen = () => {
        ws.send(' 2 + 3 ');
    };
</script>
</body>
</html>
